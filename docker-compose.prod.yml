services:
  market-signal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-signal
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/market_signal.db
      TRADING_MODE: PAPER
      ENABLE_LIVE_TRADING: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - market_signal_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  market_signal_data:
