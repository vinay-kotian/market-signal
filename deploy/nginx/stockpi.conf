# Installed in /etc/nginx/sites-available/stockpi (included inside http {}).
# Omit query strings so Zerodha callback tokens never reach access logs.
log_format stockpi '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name stockpi.vkotian.com;
    root /opt/stockpi/app/frontend/dist;
    index index.html;
    access_log /var/log/nginx/stockpi.access.log stockpi;
    error_log /var/log/nginx/stockpi.error.log warn;
    client_max_body_size 6m;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # Trailing slash strips /api/ before forwarding to FastAPI.
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Certbot adds HTTPS configuration and certificate paths after DNS is ready.
}
